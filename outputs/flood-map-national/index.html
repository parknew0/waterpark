<!doctype html>
<meta charset="utf-8">
<title>Waterpark — 전국 침수 위험</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;font:14px/1.5 -apple-system,"Apple SD Gothic Neo",sans-serif}
  #map{position:absolute;inset:0}
  .panel{position:absolute;z-index:1000;left:16px;bottom:16px;background:#fffe;
         padding:14px 18px;border-radius:10px;box-shadow:0 2px 12px #0003;width:330px}
  .rain{font-size:30px;font-weight:600;letter-spacing:-.02em}
  .rain small{font-size:14px;font-weight:400;color:#666}
  input[type=range]{width:100%;margin:10px 0 4px}
  .legend{display:flex;gap:6px;margin-top:10px;font-size:11px;color:#555}
  .legend i{width:22px;height:11px;display:inline-block;border-radius:2px;margin-right:3px;vertical-align:-1px}
  .note{margin-top:10px;font-size:11.5px;color:#777;line-height:1.45}
</style>
<div id="map"></div>
<div class="panel">
  <div class="rain"><span id="mm">0</span><small> mm / 6시간</small></div>
  <input type="range" id="slider" min="0" max="10" value="0" step="1">
  <div id="area" style="font-size:12px;color:#444"></div>
  <div class="legend">
    <span><i style="background:#ffeb82"></i>0.8~2%</span>
    <span><i style="background:#ffaa3c"></i>2~5%</span>
    <span><i style="background:#f05a28"></i>5~12%</span>
    <span><i style="background:#be141e"></i>12%+</span>
  </div>
  <div class="note">같은 땅에 비만 늘려 모델을 다시 돌린 침수 확률입니다.
    전체 평균은 0.8%입니다. 40&nbsp;mm 위로는 값이 유지되는데, 침수 조사가
    이뤄진 곳에서만 라벨이 오는 탓에 그 위 구간을 신뢰할 수 없기 때문입니다.</div>
</div>
<script>
const map = L.map('map');
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
let layer = null;
fetch('frames.json').then(r=>r.json()).then(d=>{
  const b = d.bounds, s = document.getElementById('slider');
  // 컨테이너 크기가 잡히기 전에 fitBounds 하면 줌이 0에 머문다
  map.invalidateSize();
  requestAnimationFrame(() => { map.invalidateSize(); map.fitBounds(b); });
  s.max = d.frames.length - 1;
  const show = i => {
    const f = d.frames[i];
    document.getElementById('mm').textContent = f.mm;
    document.getElementById('area').textContent =
      `침수 확률 2% 넘는 곳: 이 지역의 ${f.risky_pct}%`;
    if (layer) map.removeLayer(layer);
    layer = L.imageOverlay(f.file, b, {opacity:0.75}).addTo(map);
  };
  s.oninput = e => show(+e.target.value);
  show(0);
});
</script>
